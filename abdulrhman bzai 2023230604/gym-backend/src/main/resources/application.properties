spring.application.name=gym-backend
server.port=7000

# MySQL connection
# The database "gym_db" is created automatically if it doesn't exist.
spring.datasource.url=jdbc:mysql://localhost:3306/gym_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Hibernate creates/updates the tables from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
